name: Update CP Rating Graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Codeforces & CodeChef rating SVGs
        run: python3 scripts/generate_cp_graphs.py

      - name: Commit updated graphs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/codeforces-rating.svg assets/codechef-rating.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Codeforces & CodeChef rating graphs"
            git push
          fi
