<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Prathamesh Kinagi — One Piece Grand Line Banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="55%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#221319"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#f2c14e" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#e63946" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b101b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#3b1d26" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#141b26"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="900" height="210" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: 1.8px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; letter-spacing: 1.2px; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; letter-spacing: 2px; }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="900" height="210" fill="url(#sky)"/>
    <rect width="900" height="210" fill="url(#sunGlow)"/>

    <!-- Subtle Nautical Compass Rose (Left & Right decorative rings) -->
    <g opacity="0.11" stroke="#f2c14e" fill="none">
      <circle cx="105" cy="100" r="62" stroke-width="1"/>
      <circle cx="105" cy="100" r="46" stroke-width="0.8" stroke-dasharray="3,4"/>
      <line x1="105" y1="26" x2="105" y2="174" stroke-width="0.8"/>
      <line x1="31" y1="100" x2="179" y2="100" stroke-width="0.8"/>
      <polygon points="105,40 112,93 105,100 98,93" fill="#f2c14e"/>
      <polygon points="105,160 112,107 105,100 98,107" fill="#f2c14e" opacity="0.5"/>
      <polygon points="45,100 98,93 105,100 98,107" fill="#f2c14e" opacity="0.5"/>
      <polygon points="165,100 112,93 105,100 112,107" fill="#f2c14e" opacity="0.5"/>
    </g>

    <!-- Subtle Grand Line Log Pose Rings (Right) -->
    <g opacity="0.11" stroke="#f2c14e" fill="none">
      <circle cx="795" cy="100" r="58" stroke-width="1"/>
      <circle cx="795" cy="100" r="42" stroke-width="0.8" stroke-dasharray="4,4"/>
      <circle cx="795" cy="100" r="24" stroke-width="0.8"/>
      <line x1="760" y1="100" x2="830" y2="100" stroke="#e63946" stroke-width="1.4"/>
      <circle cx="795" cy="100" r="4" fill="#e63946" stroke="none"/>
    </g>

    <!-- Stars -->
    <g fill="#fde68a" opacity="0.45">
      <circle cx="220" cy="32" r="1.3"/>
      <circle cx="290" cy="48" r="1"/>
      <circle cx="620" cy="34" r="1.4"/>
      <circle cx="685" cy="52" r="1"/>
      <circle cx="740" cy="28" r="1.2"/>
      <circle cx="175" cy="44" r="1.1"/>
    </g>

    <!-- Stylized Straw Hat Emblem (Centered Top) -->
    <g transform="translate(450, 42)">
      <!-- Brim (drawn first so dome + crimson ribbon sit cleanly on top) -->
      <ellipse cx="0" cy="8" rx="40" ry="7.5" fill="#f2c14e" stroke="#b45309" stroke-width="1.4"/>
      <ellipse cx="0" cy="8" rx="34" ry="5.2" fill="none" stroke="#d97706" stroke-width="0.8" opacity="0.6"/>
      <!-- Dome -->
      <path d="M -22 6 C -22 -16, 22 -16, 22 6 Z" fill="#f2c14e" stroke="#b45309" stroke-width="1.3"/>
      <!-- Red Ribbon (bold & unmistakable) -->
      <path d="M -22.2 -1 C -10 3.5, 10 3.5, 22.2 -1 L 22.6 5.8 C 10 10, -10 10, -22.6 5.8 Z" fill="#e63946" stroke="#991b1b" stroke-width="0.7"/>
      <!-- Subtle straw highlight -->
      <path d="M -12 -8 C -4 -12, 6 -12, 12 -8" fill="none" stroke="#fef3c7" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- Name -->
    <text x="450" y="106" text-anchor="middle" font-size="38" fill="url(#goldText)" class="title">PRATHAMESH KINAGI</text>

    <!-- Crimson accent bar -->
    <rect x="370" y="117" width="160" height="2.5" rx="1.25" fill="#e63946"/>

    <!-- Subtitle -->
    <text x="450" y="142" text-anchor="middle" font-size="14.5" fill="#e6edf3" class="sub">Full-Stack  ·  AI Systems  ·  Cloud Deployment</text>

    <!-- Grand Line coordinates micro-tag -->
    <text x="450" y="162" text-anchor="middle" font-size="10" fill="#f2c14e" opacity="0.65" class="tag">GRAND LINE  //  NEW WORLD</text>

    <!-- Rolling Ocean Waves -->
    <path d="M 0 184 Q 75 168 150 182 T 300 182 T 450 182 T 600 182 T 750 182 T 900 182 L 900 210 L 0 210 Z" fill="url(#waveBack)"/>
    <path d="M 0 194 Q 90 180 180 194 T 360 194 T 540 194 T 720 194 T 900 194 L 900 210 L 0 210 Z" fill="url(#waveFront)"/>
    <path d="M 0 194 Q 90 180 180 194 T 360 194 T 540 194 T 720 194 T 900 194" fill="none" stroke="#f2c14e" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Outer Gold Border -->
    <rect x="0.75" y="0.75" width="898.5" height="208.5" rx="12" fill="none" stroke="#f2c14e" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>
</svg>
